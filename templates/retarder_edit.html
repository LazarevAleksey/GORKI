{% extends "base.html" %}
{% block title %}Редактирование замедлителя{% endblock %}
{% block content %}
<div class="card">
    <h2>✏️ Редактирование замедлителя: {{ retarder.model or '—' }}</h2>
    
    <form method="POST" action="/retarders/{{ retarder.id }}/edit">
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
            <div>
                <label>Модель</label>
                <input type="text" name="model" class="form-control" value="{{ retarder.model or '' }}" required>
            </div>
            <div>
                <label>Высота (мм)</label>
                <input type="number" name="height_mm" class="form-control" value="{{ retarder.height_mm or '' }}">
            </div>
            <div>
                <label>Год установки</label>
                <input type="number" name="install_year" class="form-control" value="{{ retarder.install_year or '' }}">
            </div>
            <div>
                <label>Год последнего ремонта</label>
                <input type="number" name="last_repair_year" class="form-control" value="{{ retarder.last_repair_year or '' }}">
            </div>
            <div>
                <label>Плановый год ремонта</label>
                <input type="number" name="planned_repair_year" class="form-control" value="{{ retarder.planned_repair_year or '' }}">
            </div>
            <div>
                <label>Наработка (тыс.)</label>
                <input type="number" name="total_operations" class="form-control" value="{{ retarder.total_operations or '' }}">
            </div>
            <div>
                <label>Остаточная стоимость (тыс. руб.)</label>
                <input type="number" step="0.01" name="residual_value" class="form-control" value="{{ retarder.residual_value or '' }}">
            </div>
            <div>
                <label>Номер по схеме</label>
                <input type="text" name="tor_position" class="form-control" value="{{ retarder.tor_position or '' }}">
            </div>
            <div>
                <label>Тормозная позиция</label>
                <select name="way" class="form-control">
                    <option value="">-- выберите --</option>
                    <option value="1" {% if retarder.way == '1' %}selected{% endif %}>1 позиция (ВТП)</option>
                    <option value="2" {% if retarder.way == '2' %}selected{% endif %}>2 позиция (СТП)</option>
                    <option value="3" {% if retarder.way == '3' %}selected{% endif %}>3 позиция (НТП)</option>
                </select>
            </div>
            <div style="grid-column: span 2;">
                <label>Примечания</label>
                <textarea name="notes" rows="3" class="form-control">{{ retarder.notes or '' }}</textarea>
            </div>
        </div>
        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">💾 Сохранить</button>
            <a href="/retarders/{{ retarder.id }}" class="btn" style="background:#e0e0e0;">❌ Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
