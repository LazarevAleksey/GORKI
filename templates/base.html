<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Учёт оборудования горки{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        .header { background: linear-gradient(135deg, #1a237e, #0d47a1); color: white; padding: 20px 30px; }
        .header h1 { font-size: 24px; }
        .nav { background: white; padding: 0 30px; display: flex; gap: 25px; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
        .nav a { padding: 15px 0; text-decoration: none; color: #555; font-weight: 500; border-bottom: 3px solid transparent; }
        .nav a:hover { color: #1a237e; border-bottom-color: #1a237e; }
        .container { max-width: 1400px; margin: 30px auto; padding: 0 30px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 25px; margin-bottom: 25px; }
        .card h2 { color: #1a237e; margin-bottom: 20px; border-left: 4px solid #1a237e; padding-left: 15px; }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        .table th { background: #f8f9fa; font-weight: 600; }
        .table tr:hover { background: #f5f5f5; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-active { background: #e8f5e9; color: #2e7d32; }
        .badge-reserve { background: #fff3e0; color: #e65100; }
        .badge-written_off { background: #ffebee; color: #c62828; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 500; }
        .btn-primary { background: #1a237e; color: white; }
        .btn-sm { padding: 4px 10px; font-size: 12px; background: #e3f2fd; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #1a237e, #283593); color: white; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: 700; }
        .footer { text-align: center; padding: 20px; color: #999; font-size: 12px; border-top: 1px solid #e0e0e0; margin-top: 40px; }
        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; }
        @media (max-width: 768px) { .container { padding: 0 15px; } .table { font-size: 12px; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚂 Учёт оборудования сортировочной горки</h1>
    </div>
    <div class="nav">
        <a href="/">📊 Главная</a>
        <!-- В навигацию добавить -->
        <a href="/rtu">🏭 РТУ</a>
        <a href="/constructor">🏗️ Конструктор</a>
        <a href="/retarders">🛑 Замедлители</a>
        <a href="/switches">🚉 Стрелки</a>
        <a href="/devices">📟 Оборудование</a>
        <a href="/parks">🏭 Горки</a>
        <a href="/statistics">📈 Статистика</a>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <div class="footer">
        <p>© 2024 Система учёта оборудования сортировочной горки</p>
    </div>
</body>
</html>
